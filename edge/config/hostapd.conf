# SafeFlow edge node — open Wi-Fi access point at an assembly point.
# /etc/hostapd/hostapd.conf
#
# Open network on purpose: people in a crisis must be able to join without a
# password. Isolation between clients (ap_isolate) keeps phones from talking
# to each other; only the local SafeFlow server is reachable (see nftables).

interface=wlan0
driver=nl80211
ssid=SafeFlow-SOS
country_code=AZ
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

# Open network (no WPA)
auth_algs=1
ignore_broadcast_ssid=0

# Client isolation: devices cannot reach each other, only the gateway
ap_isolate=1

# Plenty of associations for a crowded assembly point
max_num_sta=200
