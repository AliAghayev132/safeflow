#!/usr/sbin/nft -f
# SafeFlow edge node firewall — /etc/nftables.conf
#
#   wlan0  : open Wi-Fi for citizens (10.88.0.0/22)
#   uplink : link to the center (internet / satellite / radio bridge), e.g. eth0
#
# Citizens on wlan0 can reach ONLY the local SafeFlow server (HTTP :80 → app
# on :5000, DNS, DHCP). Nothing is forwarded to the uplink: no general
# internet access through this node. The node itself uses the uplink to sync.

flush ruleset

define WIFI = wlan0
define UPLINK = eth0
define APP_PORT = 5000

table inet safeflow {
  chain input {
    type filter hook input priority 0; policy drop;

    iif "lo" accept
    ct state established,related accept

    # Wi-Fi clients: DHCP, DNS, HTTP (portal + API), WebSocket on the same port
    iifname $WIFI udp dport { 67, 53 } accept
    iifname $WIFI tcp dport { 53, 80, $APP_PORT } accept

    # Maintenance over the uplink (restrict to your management network)
    iifname $UPLINK tcp dport 22 accept

    # Everything else from Wi-Fi is dropped (incl. 443: HTTPS cannot be
    # intercepted, so clients fall back to the captive-portal probe)
    iifname $WIFI reject with icmpx type admin-prohibited
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    # No forwarding at all: Wi-Fi clients never reach the internet via the node
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}

table ip safeflow_nat {
  chain prerouting {
    type nat hook prerouting priority -100;
    # Port 80 (captive-portal probes, http://safeflow.local) → the app
    iifname $WIFI tcp dport 80 redirect to :$APP_PORT
  }
}
