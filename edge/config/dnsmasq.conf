# SafeFlow edge node — DHCP + DNS for the open Wi-Fi.
# /etc/dnsmasq.d/safeflow.conf
#
# Node address on the Wi-Fi side: 10.88.0.1 (see README).

interface=wlan0
bind-interfaces
domain-needed
bogus-priv
no-resolv          # no upstream DNS — this network has no internet

# DHCP pool
dhcp-range=10.88.0.10,10.88.3.250,255.255.252.0,2h
dhcp-option=option:router,10.88.0.1
dhcp-option=option:dns-server,10.88.0.1

# RFC 8910 / RFC 8908 captive-portal API (DHCP option 114). Modern Android
# and iOS open this URL directly in the captive-portal window.
dhcp-option=114,"http://safeflow.local/"

# Every name resolves to the node: OS connectivity probes
# (connectivitycheck.gstatic.com, captive.apple.com, msftconnecttest.com, …)
# reach the local server, which redirects them to the SafeFlow app.
address=/#/10.88.0.1

# Friendly name for posters / QR codes at the assembly point
address=/safeflow.local/10.88.0.1
